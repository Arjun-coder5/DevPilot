
spring.application.name=devPilot
server.port=8080

# PostgreSQL - Neon
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Ollama Cloud - Chat
spring.ai.openai.base-url=https://ollama.com
spring.ai.openai.api-key=${OLLAMA_API_KEY}
spring.ai.openai.chat.base-url=https://ollama.com/v1
spring.ai.openai.chat.options.model=qwen3-coder:480b-cloud
spring.ai.model.chat=openai

# Token encryption
app.token-encryptor-password=${APP_TOKEN_ENCRYPTOR_PASSWORD:DevPilotLocalTestPassword2026}
app.token-encryptor-salt=${APP_TOKEN_ENCRYPTOR_SALT:0123456789abcdef}

# CORS and frontend
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# GitHub OAuth
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Audio features disabled
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.audio.transcription.enabled=false

# Database schema and vector store
spring.jpa.hibernate.ddl-auto=update
spring.ai.vectorstore.pgvector.initialize-schema=true
