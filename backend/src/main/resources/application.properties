
spring.application.name=devPilot
server.port=${PORT:8080}

# PostgreSQL - Neon
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Ollama Cloud - Chat
spring.ai.model.chat=openai
spring.ai.openai.api-key=${OLLAMA_API_KEY}
spring.ai.openai.chat.base-url=https://ollama.com/v1
spring.ai.openai.chat.options.model=qwen3-coder:480b-cloud

# Ollama Cloud - Embeddings
spring.ai.model.embedding=openai
spring.ai.openai.embedding.base-url=https://ollama.com/v1
spring.ai.openai.embedding.api-key=${OLLAMA_API_KEY}
spring.ai.openai.embedding.model=qwen3-embedding:0.6b

# Token encryption
app.token-encryptor-password=${APP_TOKEN_ENCRYPTOR_PASSWORD}
app.token-encryptor-salt=${APP_TOKEN_ENCRYPTOR_SALT}

# CORS and frontend
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# GitHub OAuth
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Disable OpenAI audio features
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.audio.transcription.enabled=false

# Database and PGVector
spring.jpa.hibernate.ddl-auto=update
spring.ai.vectorstore.pgvector.initialize-schema=true


spring.main.lazy-initialization=true
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
